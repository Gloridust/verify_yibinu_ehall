[package]
name = "yibinu-auth-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
vendored-openssl = ["yibinu-auth/vendored-openssl"]

[dependencies]
yibinu-auth = { path = "../../crates/yibinu-auth" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py39"] }
